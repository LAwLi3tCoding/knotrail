name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: node tests/desktop-smoke.mjs
      - run: npm run test:desktop:reuse
